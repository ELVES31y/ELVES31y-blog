<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>关于 - ELVES31y的小屋</title>
  <meta name="description" content="关于 ELVES31y">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>
  <div id="navbar"></div>

  <main class="main" id="app">
    <div class="container-narrow">
      <div class="about-card glass-card fade-in">
        <div class="about-cover"><div class="mask"></div></div>
        <div class="about-body">
          <div class="about-avatar"><div class="avatar-inner">E<img src="/images/avatar.jpg" alt="ELVES31y" onerror="this.style.display='none'"></div></div>
          <h1>关于我</h1>
          <p class="tagline">Hello World, I'm ELVES31y</p>

          <div class="about-divider post-content">
            <p>你好呀，欢迎来到 <strong>ELVES31y的小屋</strong> 👋</p>
            <p>这是一个属于我的小角落，用来记录生活、技术和随想。</p>
            <p>如果你喜欢这里，欢迎常来逛逛。</p>
          </div>

          <div class="about-divider">
            <h3 style="margin-bottom:16px">联系方式</h3>
            <div class="qr-grid">
              <div class="qr-box">
                <div class="ph"><img src="/images/qq-qr.webp" alt="QQ 好友码" onerror="this.style.display='none'"></div>
                <div class="name">QQ 好友</div>
              </div>
              <div class="qr-box">
                <div class="ph"><img src="/images/wechat-qr.webp" alt="微信好友码" onerror="this.style.display='none'"></div>
                <div class="name">微信好友</div>
              </div>
            </div>
          </div>

          <div class="about-divider">
            <h3 style="margin-bottom:8px">赞赏支持</h3>
            <p style="color:var(--text-2);font-size:0.9rem;margin-bottom:14px">喜欢这里的内容？欢迎请我喝杯奶茶 ☕</p>
            <div class="qr-grid">
              <div class="qr-box">
                <div class="ph"><img src="/images/wechat-reward.png" alt="微信赞赏码" onerror="this.style.display='none'"></div>
                <div class="name">微信赞赏</div>
              </div>
              <div class="qr-box">
                <div class="ph"><img src="/images/alipay-qr.jpg" alt="支付宝" onerror="this.style.display='none'"></div>
                <div class="name">支付宝</div>
              </div>
              <div class="qr-box">
                <div class="ph"><img src="/images/afdian-qr.jpg" alt="爱发电" onerror="this.style.display='none'"></div>
                <div class="name">爱发电</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/common.js?v=35"></script>
</body>
</html>
